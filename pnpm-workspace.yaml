packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
catalog:
  typescript: 7.0.2
  # The TypeScript 6 API, which TypeScript 7 no longer has, for the tests and
  # the evidence tool that compile or parse with it.
  "@typescript/typescript6": 6.0.2
  tsx: 4.23.15
  zod: 4.6.7
  pg: 8.23.1
  "@types/pg": 8.23.1
  "@types/node": 26.6.5
  drizzle-orm: 0.45.3
  better-auth: 1.7.7
  "@better-auth/drizzle-adapter": 1.7.7
  "@better-auth/passkey": 1.7.7
  hono: 4.13.12
  "@hono/node-server": 2.1.3
  "@modelcontextprotocol/sdk": 1.32.2
  "@aws-sdk/client-s3": 3.1145.0
  "@aws-sdk/lib-storage": 3.1145.0
  csv-stringify: 6.9.0
  nodemailer: 10.2.1
  "@types/nodemailer": 8.0.2
  ulid: 3.0.2
  json-canonicalize: 3.0.1
  "@js-temporal/polyfill": 0.5.1
  next: 16.4.3
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@heroui/react": 3.2.6
  "@heroui/styles": 3.2.6
  "@tanstack/react-query": 5.104.1
  "@glideapps/glide-data-grid": 6.0.3
  "@uiw/react-codemirror": 4.25.12
  lucide-react: 1.50.0
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  "@playwright/test": 1.63.0
  "@axe-core/playwright": 4.13.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005
  prettier: 3.9.9
  turbo: 2.11.6
  esbuild: 0.28.2
  vitest: 5.0.5
  jose: 6.2.12
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1145.0"
  - "@aws-sdk/lib-storage@3.1145.0"
  - "@tanstack/query-core@5.104.1"
  - "@tanstack/react-query@5.104.1"
  - lucide-react@1.50.0
  - "@avgeek-oss/design-system@1.4.0"
  - "@avgeek-oss/mintlify-docs@0.1.6"
# Optional peers that no workspace package pins; keep them on patched releases.
overrides:
  "vite@>=8.3.0 <8.3.3": 8.3.5
  # Transitive type packages and optional peers would otherwise resolve
  # @types/node to the newest major; keep one Node 26 version.
  "@types/node": 26.6.5
