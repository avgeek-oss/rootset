version: 2
# One weekly pull request covers every ecosystem below. Major versions are
# left for deliberate upgrades, and the Node image stays on the major the
# project supports. Security updates are raised separately as they appear.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  # The Compose files pin service images by tag and digest. The published
  # installation file has a byte-for-byte copy under docs, so both
  # directories are updated together. Rootset's own images follow the
  # release version, which Cut release sets, and are never bumped here.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /docs/installation-files
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ghcr.io/avgeek-oss/rootset-*"
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
