name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs are grouped by branch so a newer push supersedes the
  # running check. Every other run is grouped by commit, so main pushes and
  # tags are never cancelled or replaced while pending; the release checks
  # need a result for each exact commit.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      ROOTSET_WEB_URL: http://127.0.0.1:4300
      ROOTSET_API_URL: http://127.0.0.1:4310
      ROOTSET_PUBLIC_API_ORIGIN: http://127.0.0.1:4310
      ROOTSET_PORT: "4310"
      ROOTSET_DATABASE_URL: postgres://rootset:fixture-rootset@127.0.0.1:5432/rootset
      ROOTSET_TEST_DATABASE_URL: postgres://rootset:fixture-rootset@127.0.0.1:5432/rootset
      ROOTSET_SECRET: fixture-installation-secret-01234567890123456789
      ROOTSET_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ROOTSET_S3_ENDPOINT: http://127.0.0.1:9000
      ROOTSET_S3_REGION: us-east-1
      ROOTSET_S3_BUCKET: rootset-fixture-artifacts
      ROOTSET_S3_ACCESS_KEY: fixture-rootset
      ROOTSET_S3_SECRET_KEY: fixture-rootset-secret
      ROOTSET_SMTP_HOST: 127.0.0.1
      ROOTSET_SMTP_PORT: "1025"
      ROOTSET_SMTP_SECURE: "false"
      ROOTSET_EMAIL_FROM: rootset@example.test
      ROOTSET_VERIFICATION_RUN: ci-integration
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-rootset
          POSTGRES_DB: rootset
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d rootset"
          --health-interval 5s --health-timeout 3s --health-retries 30
      objects:
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        env:
          RUSTFS_ACCESS_KEY: fixture-rootset
          RUSTFS_SECRET_KEY: fixture-rootset-secret
          RUSTFS_CONSOLE_ENABLE: "false"
        ports: [9000:9000]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mail:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports: [1025:1025, 8025:8025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # pnpm/action-setup reads the version from packageManager in
      # package.json. It runs before setup-node so the store can be cached.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize the single non-superuser database role and baseline
        env:
          ROOTSET_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pnpm exec tsx .github/scripts/prepare-postgres.ts
          pnpm db:migrate
          docker exec --user postgres "$ROOTSET_CI_POSTGRES_CONTAINER" pg_isready -U postgres -d rootset
      - name: Check generated contracts against tracked candidate
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/generated
          test -z "$(git status --porcelain --untracked-files=all -- packages/contracts/generated)"
      - name: Prepare artifact storage before runtime integration tests
        run: |
          pnpm exec tsx tools/build-apps.ts
          node dist/objects-init.mjs
      - name: Format, lint, strict types, unit tests and production builds
        run: pnpm verify
      # One test runner runs every suite file concurrently. Each file creates
      # its own uniquely named database and object prefix and binds no fixed
      # port, so the suites cannot see each other's state.
      - name: Real PostgreSQL storage, identity, OAuth, API and MCP integration
        run: pnpm exec tsx --test tools/verification/*.test.ts packages/jobs/src/integration.ts packages/jobs/src/backups/integration.ts
      - name: Dependency vulnerability check
        run: pnpm audit --prod --audit-level=moderate
      - name: Record candidate and dependency/build manifests
        run: |
          mkdir -p verification/ci
          git rev-parse HEAD > verification/ci/candidate.txt
          sha256sum pnpm-lock.yaml packages/database/migrations/*.sql packages/contracts/generated/* > verification/ci/source-digests.txt
          cp dist/build-manifest.json verification/ci/build-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rootset-candidate-evidence-workspace
          path: |
            verification/ci/*.json
            verification/ci/*.txt
            verification/ci-integration/*.json
          if-no-files-found: warn
          retention-days: 1

  # The image build and installation smoke use only the checkout and Docker,
  # so they run beside the workspace job instead of after it.
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build non-root images from a fresh Docker context
        run: |
          mkdir -p verification/ci
          rootset_revision=$(git rev-parse HEAD)
          docker build --build-arg "ROOTSET_SOURCE_REVISION=$rootset_revision" --target runtime --tag rootset-runtime:ci .
          docker build --build-arg "ROOTSET_SOURCE_REVISION=$rootset_revision" --target worker --tag rootset-worker:ci .
          docker build --build-arg "ROOTSET_SOURCE_REVISION=$rootset_revision" --target web --tag rootset-web:ci .
          docker image inspect rootset-runtime:ci rootset-worker:ci rootset-web:ci --format '{{.Id}} {{.Config.User}}' > verification/ci/images.txt
      - name: Verify actual fresh Compose installation and preserved restart
        run: |
          node --test .github/scripts/installation-diagnostics.test.mjs
          node --test .github/scripts/migration-inventory.test.mjs
          ROOTSET_SMOKE_CI_HOST_CPU=1 ROOTSET_SMOKE_SOURCE_REVISION=$(git rev-parse HEAD) node .github/scripts/verify-installation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rootset-candidate-evidence-images
          path: |
            verification/ci/*.json
            verification/ci/*.txt
            verification/ci-integration/*.json
          if-no-files-found: warn
          retention-days: 1

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm/action-setup reads the version from packageManager in
      # package.json. It runs before setup-node so the store can be cached.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Shared component drift, content and release checks
        run: |
          pnpm docs:check
          node --test tools/release/*.test.mjs
          docker compose --env-file rootset.env.example -f compose.images.yaml config --quiet
          docker compose --env-file rootset.env.example -f compose.images.yaml --profile local-db config --quiet
      - name: Validate Mintlify pages
        working-directory: docs
        run: npx --yes mint@4.2.986 validate

  # The one check the main ruleset requires and Cut release reads. It needs
  # every other CI job and fails unless all of them succeeded; always() makes
  # a failed, cancelled or skipped job fail this check instead of skipping it,
  # because a skipped required check counts as passing.
  verify:
    needs: [workspace, production, security, docs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: rootset-candidate-evidence-*
          merge-multiple: true
          path: verification
      - name: List candidate evidence
        run: find verification -type f 2>/dev/null | sort || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootset-candidate-evidence
          path: |
            verification/ci/*.json
            verification/ci/*.txt
            verification/ci-integration/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(printf '%s' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These CI jobs did not pass: $failed"
            exit 1
          fi
