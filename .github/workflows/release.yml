name: Cut release
# On-demand replacement for creating a release tag by hand. It tags the
# current main commit as v<package.json version> and dispatches
# "Publish release images" with that tag, which verifies, builds and
# publishes the release as before. The version checks mirror that
# workflow's prepare job so a bad version is caught before anything is
# tagged. The publisher requires the tag to sit on the head of main, so
# the live head is checked again right before tagging and before the
# dispatch; if main moved in between, the new tag is removed again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Must match package.json. Defaults to package.json."
        required: false
        type: string
      dry_run:
        description: "Run every check and print the plan without tagging"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
  checks: read
concurrency:
  group: release-cutter
  cancel-in-progress: false
jobs:
  cut:
    runs-on: ubuntu-latest
    # The CI poll below waits up to 3 minutes; every other step takes seconds.
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main. Releases are cut from the head of main only."
          exit 1
      - name: Note the mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "**Dry run.** Checks only; nothing is tagged or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Release.** If every check passes, this run tags main and dispatches Publish release images." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The tag is created through the GitHub API with GH_TOKEN, so the
      # checkout does not keep a git credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Resolve the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$version" ]; then
            echo "::error::Requested $REQUESTED but package.json is $version. Merge the version bump first."
            exit 1
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version $version is not a stable release version for Rootset."
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "TAG=v$version"
          } >> "$GITHUB_ENV"
      - name: Check versions match across the release
        run: |
          set -euo pipefail
          docker compose --env-file rootset.env.example -f compose.images.yaml config --format json > "$RUNNER_TEMP/release-compose.json"
          RELEASE_TAG="$TAG" node tools/release/validate.mjs "$RUNNER_TEMP/release-compose.json"
      - name: Check no newer release is published
        run: |
          set -euo pipefail
          # Publishing marks the release as Latest, so an older version than
          # the current latest release must not be cut.
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          if [ "$(node tools/release/latest.mjs "$TAG" "$RUNNER_TEMP/releases.json")" != "true" ]; then
            echo "::error::A newer release than $TAG is already published. Bump the version in package.json."
            exit 1
          fi
      - name: Check the changelog has an entry
        run: |
          set -euo pipefail
          escaped=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          if ! grep -Eq "^## ${escaped} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## <version> (YYYY-MM-DD)' section for $VERSION. Add it before releasing."
            exit 1
          fi
      - name: Check the tag and release are new
        run: |
          set -euo pipefail
          # The listing must succeed; a failed lookup is not proof of absence.
          if ! remote_tags=$(git ls-remote --tags origin "refs/tags/$TAG"); then
            echo "::error::Could not list remote tags to check $TAG. Nothing was tagged."
            exit 1
          fi
          if [ -n "$remote_tags" ]; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          # The listing itself must succeed; an API failure is not proof of absence.
          if ! drafts=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.tag_name == env.TAG) | .draft'); then
            echo "::error::Could not list GitHub releases to check $TAG. Nothing was tagged."
            exit 1
          fi
          if printf '%s\n' "$drafts" | grep -qx false; then
            echo "::error::A published GitHub release $TAG already exists."
            exit 1
          fi
      - name: Check CI passed for this commit
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=all&per_page=100" --paginate --slurp > "$RUNNER_TEMP/release-checks.json"
            if node tools/release/check.mjs --commit "$GITHUB_SHA" --checks "$RUNNER_TEMP/release-checks.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::The latest verify result for $GITHUB_SHA is not a success. Wait for main to go green, then run this again."
              exit 1
            fi
            echo "Waiting for the exact-commit CI result ($attempt/12)"
            sleep 15
          done
      - name: Plan
        run: |
          {
            echo "## Release $TAG"
            echo
            echo "- Commit: \`$GITHUB_SHA\` on \`main\`"
            echo "- Tag: \`$TAG\`, annotated, message "Rootset $TAG""
            echo "- Then: dispatch **Publish release images** with \`release_tag=$TAG\`"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo
              echo "Dry run: nothing was tagged or dispatched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create and push the tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          live=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::main moved to ${live:0:7} while this run checked ${GITHUB_SHA:0:7}. Nothing was tagged; run again on the new head."
            exit 1
          fi
          # An annotated tag object, then the ref that points to it, created
          # with GH_TOKEN instead of a git credential.
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Rootset $TAG" -f object="$GITHUB_SHA" -f type=commit \
            -f "tagger[name]=github-actions[bot]" \
            -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_object" --silent
      - name: Dispatch Publish release images
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          live=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$live" != "$GITHUB_SHA" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --silent
            echo "::error::main moved to ${live:0:7} after $TAG was created. The publisher requires the tag on the head of main, so the tag was removed again. Run Cut release again on the new head."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run release-images.yml --ref main -f "release_tag=$TAG"; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not dispatch Publish release images. The tag $TAG exists; dispatch it by hand with release_tag=$TAG."
              exit 1
            fi
            sleep 5
          done
          sleep 10
          url=$(gh run list --workflow release-images.yml --event workflow_dispatch --limit 1 --json url --jq '.[0].url // ""')
          {
            echo
            echo "Tagged \`$TAG\`. Publish run: ${url:-not visible yet; see the Actions tab}"
          } >> "$GITHUB_STEP_SUMMARY"
