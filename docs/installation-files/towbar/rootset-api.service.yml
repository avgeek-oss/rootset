# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: rootset-api
name: Rootset API
deployment:
  type: image
  image: ghcr.io/avgeek-oss/rootset-api:0.2.4
autoDeploy: false
rollout:
  type: recreate
  maintenanceMode: true
  reason: Keep one instance per service during an upgrade.
container:
  network: rootset
  port: 4310
  resources:
    cpus: 0.5
    memory: 1g
  entrypoint: /bin/sh
  command:
    - -ec
    - |
      export ROOTSET_HOST=0.0.0.0
      export ROOTSET_ARTIFACT_TEMP_DIR=/var/lib/rootset/artifact-spool
      export NODE_OPTIONS="--max-old-space-size=768 --max-http-header-size=196608"
      exec node dist/api.mjs
  volumes:
    - name: artifact-spool
      mountPath: /var/lib/rootset/artifact-spool
      initialData: image
health:
  type: http
  path: /health/ready
  timeoutSeconds: 180
hooks:
  preDeploy:
    entrypoint: node
    command: [dist/migrate.mjs]
    timeoutSeconds: 300
secrets:
  preDeploy: [ROOTSET_DATABASE_URL]
  runtime:
    - ROOTSET_DATABASE_URL
    - ROOTSET_API_URL
    - ROOTSET_WEB_URL
    - ROOTSET_SECRET
    - ROOTSET_ENCRYPTION_KEY
    - ROOTSET_S3_ENDPOINT
    - ROOTSET_S3_BUCKET
    - ROOTSET_S3_ACCESS_KEY
    - ROOTSET_S3_SECRET_KEY
    - ROOTSET_SMTP_HOST
    - ROOTSET_SMTP_PORT
    - ROOTSET_SMTP_SECURE
    - ROOTSET_SMTP_USER
    - ROOTSET_SMTP_PASSWORD
    - ROOTSET_EMAIL_FROM
ingress:
  type: proxy
domains:
  primary: rootset-api.example.com
tls:
  mode: direct
environments:
  production:
    server: 192.0.2.10
